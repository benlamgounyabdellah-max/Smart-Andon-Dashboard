<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Andon</title><style>body{font-family:Arial;background:#0b1220;color:#f4f7fb;margin:0}.w{max-width:1000px;margin:auto;padding:20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{background:#121c2f;padding:16px;border-radius:15px}.v{font-size:25px;font-weight:bold;margin-top:8px}.m{color:#93a4bd}table{width:100%;margin-top:20px;border-collapse:collapse;background:#121c2f}th,td{padding:12px;border-bottom:1px solid #24324a;text-align:left}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w"><h1>SMART ANDON — MACHINE 01</h1><p class="m">Remote Maintenance Monitoring</p><div class="g"><div class="c"><span class="m">Status</span><div class="v" id="s">—</div></div><div class="c"><span class="m">Fault</span><div class="v" id="f">—</div></div><div class="c"><span class="m">Availability</span><div class="v" id="a">—</div></div><div class="c"><span class="m">Total Faults</span><div class="v" id="n">—</div></div><div class="c"><span class="m">MTBF</span><div class="v" id="b">—</div></div><div class="c"><span class="m">MTTR</span><div class="v" id="r">—</div></div></div><h2>Intervention History</h2><table><thead><tr><th>#</th><th>Fault</th><th>Response</th><th>Repair</th><th>Downtime</th><th>Status</th></tr></thead><tbody id="h"></tbody></table></div><script>
const DB='https://smart-andon-14ab6-default-rtdb.firebaseio.com';
const E=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function G(p){let r=await fetch(DB+p+'.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function U(){try{let[c,h]=await Promise.all([G('/smartAndon/current'),G('/smartAndon/interventions')]);if(c){s.textContent=c.status;f.textContent=c.fault;a.textContent=c.availability+' %';n.textContent=c.totalFaults;b.textContent=c.MTBF_sec+' s';r.textContent=c.MTTR_sec+' s'}let x=h?Object.values(h).sort((x,y)=>(y.number||0)-(x.number||0)):[];document.getElementById('h').innerHTML=x.map(i=>`<tr><td>${E(i.number)}</td><td>${E(i.fault)}</td><td>${E(i.responseTime_sec)} s</td><td>${E(i.repairTime_sec)} s</td><td>${E(i.downtime_sec)} s</td><td>${E(i.status)}</td></tr>`).join('')||'<tr><td colspan="6">No interventions yet</td></tr>'}catch(e){document.getElementById('s').textContent='CONNECTION ERROR'}}
U();setInterval(U,2000);</script></body></html>
